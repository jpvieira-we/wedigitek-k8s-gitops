apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: surveys-reports-prd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jpvieira-we/wedigitek-k8s-gitops.git
    targetRevision: main
    path: applications/prd/surveys-reports
  destination:
    server: https://kubernetes.default.svc
    namespace: surveys-reports-prd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

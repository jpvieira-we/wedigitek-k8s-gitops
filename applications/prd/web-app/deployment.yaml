apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: web-app-prd
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "monitoring/nodejs-instrumentation"
      labels:
        app: web-app
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: web-app
        image: ghcr.io/wedigitek/web-app:rc
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: web-app-secrets-kv
        volumeMounts:
        - name: keyvault-env
          mountPath: /mnt/secrets-store
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "25m"
          limits:
            memory: "512Mi"
            cpu: "200m"
      volumes:
      - name: keyvault-env
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: web-app-keyvault-env

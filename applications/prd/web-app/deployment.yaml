apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: web-app-prd
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: web-app
        image: ghcr.io/wedigitek/web-app:rc
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "25m"
          limits:
            memory: "512Mi"
            cpu: "200m"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wefood-onboarding
  namespace: wefood-onboarding-prd
  labels:
    app: wefood-onboarding
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: wefood-onboarding
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "monitoring/nodejs-instrumentation"
      labels:
        app: wefood-onboarding
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: wefood-onboarding
        image: ghcr.io/wedigitek/wefood-onboarding:main
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "25m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: activity-logs-service-keyvault-env
  namespace: activity-logs-service-prd
spec:
  provider: azure
  secretObjects:
  - secretName: activity-logs-service-secrets-kv
    type: Opaque
    data:
    - objectName: activity-logs-service-node-env
      key: NODE_ENV
    - objectName: activity-logs-service-port
      key: PORT
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "ecc658e3-b1ba-46b7-8f7c-b5cf75272df2"
    keyvaultName: "kv-wedigitek-prd"
    tenantId: "9fabb809-1920-4f77-8694-f9af659b5d21"
    objects: |
      array:
        - |
          objectName: activity-logs-service-node-env
          objectType: secret
        - |
          objectName: activity-logs-service-port
          objectType: secret

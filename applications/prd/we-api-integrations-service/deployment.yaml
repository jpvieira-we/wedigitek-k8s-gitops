apiVersion: apps/v1
kind: Deployment
metadata:
  name: we-api-integrations-service
  namespace: we-api-integrations-service-prd
  labels:
    app: we-api-integrations-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: we-api-integrations-service
  template:
    metadata:
      labels:
        app: we-api-integrations-service
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      volumes:
      - name: keyvault-env
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: we-api-integrations-service-keyvault-env
      containers:
      - name: we-api-integrations-service
        image: ghcr.io/wedigitek/we-services-integrations:rc
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: we-api-integrations-service-secrets-kv
        volumeMounts:
        - name: keyvault-env
          mountPath: /mnt/keyvault-env
          readOnly: true
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "25m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

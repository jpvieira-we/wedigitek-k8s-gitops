apiVersion: apps/v1
kind: Deployment
metadata:
  name: sefaz-services
  namespace: wedigitek-prd
  labels:
    app: sefaz-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sefaz-services
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "monitoring/nodejs-instrumentation"
      labels:
        app: sefaz-services
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: sefaz-services
        image: ghcr.io/wedigitek/sefaz-services:main
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: sefaz-services-secrets
        ports:
        - containerPort: 80
        volumeMounts:
        - name: sefaz-certificates
          mountPath: /app/certificates
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "25m"
          limits:
            memory: "512Mi"
            cpu: "300m"
      volumes:
      - name: sefaz-certificates
        secret:
          secretName: sefaz-certificates

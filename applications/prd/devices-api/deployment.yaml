apiVersion: apps/v1
kind: Deployment
metadata:
  name: devices-api
  namespace: devices-api-prd
  labels:
    app: devices-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devices-api
  template:
    metadata:
      labels:
        app: devices-api
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      volumes:
      - name: keyvault-env
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: devices-api-keyvault-env
      containers:
      - name: devices-api
        image: ghcr.io/wedigitek/api-devices:rc
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: devices-api-secrets-kv
        volumeMounts:
        - name: keyvault-env
          mountPath: /mnt/keyvault-env
          readOnly: true
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "25m"
          limits:
            memory: "512Mi"
            cpu: "200m"


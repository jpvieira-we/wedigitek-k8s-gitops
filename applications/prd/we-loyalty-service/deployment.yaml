apiVersion: apps/v1
kind: Deployment
metadata:
  name: we-loyalty-service
  namespace: we-loyalty-service-prd
  labels:
    app: we-loyalty-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: we-loyalty-service
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "monitoring/nodejs-instrumentation"
      labels:
        app: we-loyalty-service
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      volumes:
      - name: keyvault-env
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: we-loyalty-service-keyvault-env
      containers:
      - name: we-loyalty-service
        image: ghcr.io/wedigitek/we-services-loyalty:main
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: we-loyalty-service-secrets-kv
        env:
        - name: WE_LOYALTY_SERVICE_PORT
          value: "3000"
        volumeMounts:
        - name: keyvault-env
          mountPath: /mnt/keyvault-env
          readOnly: true
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "25m"
          limits:
            memory: "512Mi"
            cpu: "200m"

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: we-api-aks-mongo-isolation
  namespace: we-api-prd
spec:
  podSelector:
    matchLabels:
      app: we-api-aks-mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: we-api
        - podSelector:
            matchLabels:
              app: we-api-mongo-sync
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wefood-delivery-notifier-prd
          podSelector:
            matchLabels:
              app: wefood-delivery-notifier
      ports:
        - protocol: TCP
          port: 27017
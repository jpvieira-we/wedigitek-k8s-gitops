apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: we-api-prd

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - ingress.yaml
  - hpa.yaml
  - mongodb-isolated.yaml
  - mongodb-sync-cronjob.yaml
  - mongodb-networkpolicy.yaml
  - secretproviderclass-env.yaml
  - secretproviderclass-files.yaml

labels:
  - pairs:
      environment: production
      managed-by: argocd

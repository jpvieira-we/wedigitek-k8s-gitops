fullnameOverride: blackbox-exporter
releaseLabel: false

config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        preferred_ip_protocol: ip4
        follow_redirects: true
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
    http_health_2xx:
      prober: http
      timeout: 10s
      http:
        method: GET
        preferred_ip_protocol: ip4
        follow_redirects: true
        valid_status_codes: [200]

serviceMonitor:
  selfMonitor:
    enabled: true
    labels:
      release: prometheus-stack

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
